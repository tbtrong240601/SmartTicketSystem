{% extends "base.html" %}{% block content %}<div class="card narrow"><div class="card-body"><h1 class="page-title">Đổi mật khẩu</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Mật khẩu hiện tại<input class="form-control" name="old_password" type="password" required autocomplete="current-password"></label><label>Mật khẩu mới<input class="form-control" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><button class="btn btn-primary mt-3">Lưu mật khẩu</button></form></div></div>{% endblock %}
