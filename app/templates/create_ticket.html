{% extends "base.html" %}{% block content %}<div class="page-heading"><div><p class="eyebrow">YÊU CẦU MỚI</p><h1 class="page-title">Bạn cần hỗ trợ điều gì?</h1></div><a href="{{ url_for('knowledge.index') }}">Tra cứu hướng dẫn trước →</a></div><div class="card narrow"><div class="card-body"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Tiêu đề<input class="form-control" name="title" maxlength="200" required placeholder="Ví dụ: Không kết nối được Wi-Fi"></label><label>Danh mục<select name="category_id" class="form-select"><option value="">Chưa phân loại</option>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label><label>Mô tả sự cố<textarea class="form-control" name="description" rows="7" maxlength="10000" required placeholder="Triệu chứng, thời điểm, thông báo lỗi và các bước đã thử…"></textarea></label><p class="text-muted small">Không đưa mật khẩu hoặc khóa truy cập vào Ticket.</p><button class="btn btn-primary">Gửi yêu cầu</button><a class="btn btn-link" href="{{ url_for('main.home') }}">Hủy</a></form></div></div>{% endblock %}
