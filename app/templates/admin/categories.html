{% extends 'base_it.html' %}{% block content %}<p class="eyebrow">QUẢN TRỊ</p><h1 class="page-title mb-4">Danh mục hỗ trợ</h1><div class="card mb-4"><div class="card-body"><h2 class="h5">Thêm danh mục</h2><form method="post" class="filter-bar"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control" name="name" maxlength="100" placeholder="Tên danh mục" aria-label="Tên danh mục" required><input class="form-control" name="description" maxlength="255" placeholder="Mô tả ngắn" aria-label="Mô tả"><button class="btn btn-primary">Thêm</button></form></div></div>{% for category in categories %}<div class="card mb-3"><div class="card-body"><form method="post" action="{{ url_for('admin.edit_category',category_id=category.id) }}" class="filter-bar"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" class="form-control" value="{{ category.name }}" maxlength="100" required aria-label="Tên danh mục"><input name="description" class="form-control" value="{{ category.description or '' }}" maxlength="255" aria-label="Mô tả"><button class="btn btn-outline-primary">Lưu</button></form><form method="post" action="{{ url_for('admin.delete_category',category_id=category.id) }}" data-confirm="Xóa danh mục này nếu chưa được sử dụng?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Xóa danh mục</button></form></div></div>{% else %}<p>Chưa có danh mục.</p>{% endfor %}{% endblock %}
