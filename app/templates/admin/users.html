{% extends 'base_it.html' %}{% block content %}<p class="eyebrow">QUẢN TRỊ</p><h1 class="page-title mb-4">Người dùng & vai trò</h1><div class="card mb-4"><div class="card-body"><h2 class="h5">Tạo tài khoản</h2><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-4"><label>Tên đăng nhập<input class="form-control" name="username" minlength="3" maxlength="100" required autocomplete="off"></label></div><div class="col-md-3"><label>Mật khẩu<input type="password" class="form-control" name="password" minlength="8" maxlength="128" required autocomplete="new-password"></label></div><div class="col-md-3"><label>Vai trò<select class="form-select" name="role">{% for role in roles %}<option>{{ role }}</option>{% endfor %}</select></label></div><div class="col-md-2 align-self-end"><button class="btn btn-primary">Tạo</button></div></form></div></div>{% for user in users %}<div class="card mb-3"><div class="card-body"><div class="page-heading"><h2 class="h5">{{ user.username }} <small class="text-muted">#{{ user.id }}</small></h2><span class="status-pill">{{ 'Hoạt động' if user.enabled else 'Đã khóa' }}</span></div><form method="post" action="{{ url_for('admin.edit_user',user_id=user.id) }}" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-3"><label>Vai trò<select class="form-select" name="role">{% for role in roles %}<option {{ 'selected' if user.role == role }}>{{ role }}</option>{% endfor %}</select></label></div><div class="col-md-4"><label>Đặt lại mật khẩu (tùy chọn)<input class="form-control" type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Để trống nếu giữ nguyên"></label></div><div class="col-md-3 align-self-end"><label class="check-label"><input type="checkbox" name="enabled" {{ 'checked' if user.enabled }}> Cho phép đăng nhập</label></div><div class="col-md-2 align-self-end"><button class="btn btn-outline-primary">Lưu</button></div></form></div></div>{% endfor %}{% endblock %}
