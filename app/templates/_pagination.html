{% if page.pages > 1 %}<nav class="pagination-bar" aria-label="Phân trang">{% if page.has_prev %}<a href="{{ url_for(request.endpoint, page=page.prev_num, q=request.args.get('q',''), status=request.args.get('status',''), category_id=request.args.get('category_id','')) }}">← Trước</a>{% endif %}<span>Trang {{ page.page }} / {{ page.pages }}</span>{% if page.has_next %}<a href="{{ url_for(request.endpoint, page=page.next_num, q=request.args.get('q',''), status=request.args.get('status',''), category_id=request.args.get('category_id','')) }}">Sau →</a>{% endif %}</nav>{% endif %}
